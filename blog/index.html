<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施工ブログ｜大嶋塗装株式会社</title>
<meta name="description" content="大嶋塗装株式会社の施工事例・現場ブログです。">
<link rel="stylesheet" href="../assets/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-heading: "Cormorant Garamond", "Shippori Mincho B1", serif;
    --font-body: "Lora", "Shippori Mincho B1", serif;
  }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  a { color: var(--color-accent-700); }
  a:hover { color: var(--color-accent); }
  h1, h2, h3, h4 { font-weight: 400; }
</style>
</head>
<body>

    <a href="../index.html#top" style="display: grid; justify-items: center; gap: 4px; text-decoration: none; color: var(--color-text); margin-bottom: 14px;">
      <span style="font-family: var(--font-heading); font-size: clamp(22px, 3.2vw, 32px); letter-spacing: 0.14em;">大嶋塗装株式会社</span>
      <span style="font-size: 10px; letter-spacing: 0.2em; color: var(--color-neutral-600); text-transform: uppercase; text-align: center;">Oshima Tosou Co., Ltd. — Since 1977</span>
    </a>
    <nav style="display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(4px, 1.6vw, 22px);">
        <a href="../index.html#top" style="display: grid; justify-items: center; gap: 8px; text-decoration: none; color: var(--color-text); padding: 6px 10px;">ホーム</a>
        <a href="../works.html" style="display: grid; justify-items: center; gap: 8px; text-decoration: none; color: var(--color-text); padding: 6px 10px;">施工実績</a>
        <a href="index.html" aria-current="page" style="display: grid; justify-items: center; gap: 8px; text-decoration: none; color: var(--color-accent); padding: 6px 10px;">ブログ</a>
        <a href="../contact.html" style="display: grid; justify-items: center; gap: 8px; text-decoration: none; color: var(--color-text); padding: 6px 10px;">お問合せ</a>
    </nav>
  </header>
  <section style="padding: clamp(36px, 5vw, 64px) clamp(20px, 5vw, 64px) clamp(16px, 3vw, 32px); max-width: 1000px; margin: 0 auto;">
    <h1 style="font-size: clamp(26px, 3.8vw, 38px); letter-spacing: 0.1em; margin: 0 0 28px;">施工ブログ</h1>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;">
        <button type="button" class="blog-filter-btn is-active" data-filter="all" onclick="filterBlog(this, 'all')" style="padding:8px 16px; border-radius:999px; border:1px solid var(--color-divider); background:var(--color-accent); color:#fff; font-size:13px; cursor:pointer;">すべて</button>
        <button type="button" class="blog-filter-btn" data-filter="施工事例" onclick="filterBlog(this, '施工事例')" style="padding:8px 16px; border-radius:999px; border:1px solid var(--color-divider); background:transparent; color:var(--color-text); font-size:13px; cursor:pointer;">施工事例</button>
        <button type="button" class="blog-filter-btn" data-filter="ボランティア活動" onclick="filterBlog(this, 'ボランティア活動')" style="padding:8px 16px; border-radius:999px; border:1px solid var(--color-divider); background:transparent; color:var(--color-text); font-size:13px; cursor:pointer;">ボランティア活動</button>
        <button type="button" class="blog-filter-btn" data-filter="社員の日常" onclick="filterBlog(this, '社員の日常')" style="padding:8px 16px; border-radius:999px; border:1px solid var(--color-divider); background:transparent; color:var(--color-text); font-size:13px; cursor:pointer;">社員の日常</button>
        
    </div>
    <div id="blog-card-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:20px;">
        <a href="02-2026-10-30.html" data-category="施工事例" class="blog-card" style="display:block; text-decoration:none; color:var(--color-text); border:1px solid var(--color-divider); border-radius:var(--radius-md); overflow:hidden;"><div class="ph-slot" style="position:static; aspect-ratio:16/10;"><img src="images/02-photo1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div><div style="padding:14px 16px;"><p style="margin:0 0 6px; font-size:11px; letter-spacing:0.08em; color:var(--color-accent-700);">施工事例</p><p style="margin:0 0 6px; font-size:11.5px; letter-spacing:0.08em; color:var(--color-neutral-600);">2026-10-30</p><p style="margin:0; font-size:15px; letter-spacing:0.04em;">施工事例：さいたま市エリアの壁塗り</p></div></a>
        <a href="01-2026-10-30.html" data-category="施工事例" class="blog-card" style="display:block; text-decoration:none; color:var(--color-text); border:1px solid var(--color-divider); border-radius:var(--radius-md); overflow:hidden;"><div class="ph-slot" style="position:static; aspect-ratio:16/10;"><img src="images/01-photo1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div><div style="padding:14px 16px;"><p style="margin:0 0 6px; font-size:11px; letter-spacing:0.08em; color:var(--color-accent-700);">施工事例</p><p style="margin:0 0 6px; font-size:11.5px; letter-spacing:0.08em; color:var(--color-neutral-600);">2026-10-30</p><p style="margin:0; font-size:15px; letter-spacing:0.04em;">施工事例：さいたま市エリアの壁塗り</p></div></a>
        <a href="ボランティア活動-2026-10-29-1.html" data-category="ボランティア活動" class="blog-card" style="display:block; text-decoration:none; color:var(--color-text); border:1px solid var(--color-divider); border-radius:var(--radius-md); overflow:hidden;"><div class="ph-slot" style="position:static; aspect-ratio:16/10;"><img src="images/ボランティア活動-2026-10-29-1-photo1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div><div style="padding:14px 16px;"><p style="margin:0 0 6px; font-size:11px; letter-spacing:0.08em; color:var(--color-accent-700);">ボランティア活動</p><p style="margin:0 0 6px; font-size:11.5px; letter-spacing:0.08em; color:var(--color-neutral-600);">2026-10-29</p><p style="margin:0; font-size:15px; letter-spacing:0.04em;">草むしりボランティアに参加しました！</p></div></a>
        <a href="03-2026-10-23.html" data-category="施工事例" class="blog-card" style="display:block; text-decoration:none; color:var(--color-text); border:1px solid var(--color-divider); border-radius:var(--radius-md); overflow:hidden;"><div class="ph-slot" style="position:static; aspect-ratio:16/10;"><img src="images/03-photo1.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div><div style="padding:14px 16px;"><p style="margin:0 0 6px; font-size:11px; letter-spacing:0.08em; color:var(--color-accent-700);">施工事例</p><p style="margin:0 0 6px; font-size:11.5px; letter-spacing:0.08em; color:var(--color-neutral-600);">2026-10-23</p><p style="margin:0; font-size:15px; letter-spacing:0.04em;">施工事例：川崎市エリアの壁塗り</p></div></a>
        
    </div>
    <p id="blog-empty-msg" style="display:none; color:var(--color-neutral-600); margin-top:20px;">このカテゴリの記事はまだありません。</p>
  </section>
  <footer style="border-top: 1px solid var(--color-divider); background: var(--color-neutral-100); padding: 24px; text-align: center;">
    <p style="margin: 0; font-size: 11px; letter-spacing: 0.1em; color: var(--color-neutral-700);">© 大嶋塗装株式会社</p>
  </footer>
<script>
function filterBlog(btn, cat) {
  document.querySelectorAll('.blog-filter-btn').forEach(function(b) {
    b.classList.remove('is-active');
    b.style.background = 'transparent';
    b.style.color = 'var(--color-text)';
  });
  btn.classList.add('is-active');
  btn.style.background = 'var(--color-accent)';
  btn.style.color = '#fff';
  var any = false;
  document.querySelectorAll('.blog-card').forEach(function(card) {
    var show = (cat === 'all' || card.getAttribute('data-category') === cat);
    card.style.display = show ? '' : 'none';
    if (show) any = true;
  });
  document.getElementById('blog-empty-msg').style.display = any ? 'none' : 'block';
}
</script>
</div>
<script src="../assets/site.js"></script>
</body>
</html>
